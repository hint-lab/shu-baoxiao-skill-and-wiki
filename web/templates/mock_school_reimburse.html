<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>模拟报销单</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>模拟报销单</h1>
            <p>用于验证 Playwright 代填动作。这里不会提交到真实上海大学财务系统。</p>
          </div>
        </header>

        <form class="panel mock-form" data-testid="reimbursement-form">
          <label class="field">
            <span>报销入口</span>
            <select name="entry" data-testid="school-entry">
              <option value="">请选择</option>
              <option value="日常报销">日常报销</option>
              <option value="差旅报销">差旅报销</option>
              <option value="借款">借款</option>
            </select>
          </label>

          <label class="field">
            <span>报销事由</span>
            <textarea name="reason" rows="5" data-testid="reason"></textarea>
          </label>

          <label class="field">
            <span>经费项目</span>
            <input name="project" data-testid="project" placeholder="需老师本人确认后选择">
          </label>

          <label class="field">
            <span>收款账号</span>
            <input name="payee" data-testid="payee" placeholder="需老师本人确认">
          </label>

          <section class="mock-upload">
            <h2>附件上传队列</h2>
            <ul data-testid="attachment-list"></ul>
          </section>

          <section class="mock-upload">
            <h2>Agent 暂停点</h2>
            <ul data-testid="pause-list"></ul>
          </section>

          <button type="button" class="danger" data-testid="submit-precheck" disabled>提交预审</button>
          <p class="empty" data-testid="stop-message">等待 Agent 代填。</p>
        </form>
      </section>
    </main>
  </body>
</html>
